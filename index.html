<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <main id="main">
        <div class="container text-center">
            <div class="row">
                <div class="col">

                    <div id="conteudo">
                        <!--login / fotos aparecem aqui-->
                    </div>

                </div>
            </div>

            <!--essa linha será apagada antes do envio final-->
            <div class="row">
                <div class="col">

                    <div id="dados">
                        <!--dados aparecem aqui-->
                    </div>

                </div>
            </div>
        </div>
    </main>

    <dialog class="dialog" id="exampleDialog">
        <div class="dialog-header">
            <h1 class="dialog-title">Dialog title</h1>
        </div>
        <div class="dialog-body">
            <p id="mensagem">
                <!--mensagem aparece aqui-->
            </p>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Close</button>
        </div>
    </dialog>

    <!-- JavaScript personalizado -->
    <script type="module" src="JS/geraLogin.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
